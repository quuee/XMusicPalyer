[versions]
# Build
agp = "9.1.1"
kotlin = "2.3.21"
# Kotlin 注解处理器，用于代码生成
ksp = "2.3.8"
core-ktx = "1.18.0"

# BOM 统一管理所有 Compose 库版本，确保兼容性
compose-bom = "2026.05.01"
# Android 核心库版本
compose-activity = "1.13.0"
compose-lifecycle-runtimeKtx = "2.10.0"


# Navigation2
navigation-compose = "2.9.8"
# todo Navigation3
navigation3 = "1.1.2"

# Koin (依赖注入 4.x)
koin = "4.2.1"

# Coroutines
coroutines = "1.11.0"

# hilt 需要和 kotlin 版本对应, 麻烦老是编译失败，换koin
hilt = "2.59.2"

# Network
# OkHttp HTTP 客户端: https://square.github.io/okhttp/
okhttp = "5.3.2"
# Retrofit HTTP 客户端: https://square.github.io/retrofit/
retrofit = "3.0.0"
# Retrofit Kotlinx Serialization 转换器: https://github.com/JakeWharton/retrofit2-kotlinx-serialization-converter
retrofit2KotlinxSerializationConverter = "1.0.0"
# OkHttp 日志拦截器: https://github.com/square/okhttp/tree/master/okhttp-logging-interceptor
loggingInterceptor = "5.3.2"
# Chucker 网络调试工具: https://github.com/ChuckerTeam/chucker
# 说明: 通过 OkHttp 拦截器机制在应用通知栏显示网络请求功能
chucker = "4.3.1"


# 数据库
room = "2.8.4"


# Serialization
kotlinx-serialization = "1.11.0"

# Image
coil = "3.4.0"


# Testing
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

# UI 相关版本
# AndroidX AppCompat: https://developer.android.com/jetpack/androidx/releases/appcompat
appcompat = "1.7.1"
# Material Design Components: https://github.com/material-components/material-components-android
material = "1.14.0-alpha10"
uiText = "1.11.2"

# 日志框架版本
# Timber 日志库: https://github.com/JakeWharton/timber
timber = "5.0.1"

# Toast 相关版本
# Toaster 吐司框架: https://github.com/getActivity/Toaster
toaster = "13.8"

# 数据存储相关版本
# 腾讯 MMKV 高性能存储: https://github.com/Tencent/MMKV
mmkv = "2.4.0"

# 动画相关版本
# Lottie Compose 动画库: https://airbnb.io/lottie/#/android-compose
# 说明: 支持 After Effects 动画的 Compose 库
lottieCompose = "6.7.1"

# 权限相关版本
# XXPermissions 权限框架: https://github.com/getActivity/XXPermissions
xxpermissions = "28.0"
accompanist = "0.37.3"

# 骨架屏
# https://github.com/valentinilk/compose-shimmer
composeShimmer = "1.3.3"


[libraries]
# AndroidX Core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
# 将 Compose 与 Activity 绑定（如 setContent 方法）
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "compose-activity" }
# 与 ViewModel 集成，方便在 Compose 中获取和管理 ViewModel
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "compose-lifecycle-runtimeKtx" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "compose-lifecycle-runtimeKtx" }


# Compose BOM
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
# 仅在 Debug 模式下生效，提供交互式预览和布局检查
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
## 支持 @Preview 注解
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
# Material Design 3（最常用）：包含最新的 Material You 组件、主题和动态配色，且它内部已经包含了 foundation 和 ui 库
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }


# 导航
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
# 新导航
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version="2.10.0" }


# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-coroutines = { module = "io.insert-koin:koin-core-coroutines", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koin" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Coil
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# Accompanist
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist" }

# Network
okhttp3 = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "loggingInterceptor" }
retrofit2-kotlinx-serialization-converter = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofit2KotlinxSerializationConverter" }



# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }

# 序列化相关库
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }



[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# KSP
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[bundles]
compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-material3",
    "androidx-compose-material-icons-extended"
]
koin = [
    "koin-core",
    "koin-coroutines",
    "koin-android",
    "koin-compose",
    "koin-compose-viewmodel",
    "koin-androidx-compose",
    "koin-annotations"
]
network = [
    "okhttp3",
    "retrofit",
    "okhttp-logging",
    "retrofit2-kotlinx-serialization-converter"
]
room = [
    "room-runtime",
    "room-ktx"
]
coroutines = [
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android"
]